name: Update raid progression

on:
  schedule:
    - cron: '17 12 * * *'   # daily, 7:17 AM Central (6:17 AM during standard time)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull latest progression from Raider.IO
        run: node scripts/update-progression.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/progression.js
          git commit -m "Update raid progression from Raider.IO"
          git push
